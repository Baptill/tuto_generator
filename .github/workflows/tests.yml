# Lance la suite de tests à chaque modification de master, et sur chaque pull
# request qui vise master (pour voir le résultat avant de fusionner).
name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

# Un nouveau push annule le run encore en cours sur la même branche.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Même version que l'image Docker de production.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # WeasyPrint (rendu PDF) s'appuie sur Pango et HarfBuzz — mêmes paquets
      # que dans le Dockerfile.
      - name: Dépendances système de WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Dépendances Python
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests/ -v
