id: "2026-07-exemple-tuto"
type: "tutoriel"
template_id: "tuto-release"
langue: "fr"
titre: "Comment configurer X dans la release 4.8"
resume: "Guide pas à pas pour activer et configurer la fonctionnalité X."
auteur: "Baptiste Lemoine"
sections:
  - id: "sec-1"
    titre: "Introduction"
    hauteur: 1
    blocs:
      - type: "paragraphe"
        texte: |
          Ce tutoriel explique comment activer la fonctionnalité **X** ajoutée
          dans la release 4.8, et comment l'adapter à votre environnement.
  - id: "sec-2"
    titre: "Avant de commencer"
    hauteur: 1
    blocs:
      - type: "encadre"
        style: "astuce"
        texte: "Pensez à **sauvegarder votre configuration actuelle** avant de continuer."
  - id: "sec-3"
    titre: "Prérequis"
    hauteur: 2
    blocs:
      - type: "paragraphe"
        texte: |
          Vérifiez que les éléments suivants sont réunis :
          - accès administrateur à l'application
          - version 4.8 ou supérieure installée
          - droits d'écriture sur le dossier de configuration
      - type: "image"
        fichier: "assets/prerequis.png"
        legende: "Écran des prérequis"
        largeur_mm: 130
  - id: "sec-4"
    titre: "Étapes de configuration"
    hauteur: 4
    blocs:
      - type: "paragraphe"
        texte: |
          Ouvrez le panneau de configuration puis suivez les étapes ci-dessous :
          - ouvrir le menu **Paramètres**
          - sélectionner l'onglet **Fonctionnalités**
          - activer l'option **X**
      - type: "image"
        fichier: "assets/etape2.png"
        legende: "Écran de configuration"
      - type: "encadre"
        style: "attention"
        texte: "L'activation de **X** nécessite un redémarrage du service."
  - id: "sec-5"
    titre: "Vérification du résultat"
    hauteur: 3
    blocs:
      - type: "paragraphe"
        texte: "Une fois le service redémarré, contrôlez que la fonctionnalité est bien active."
      - type: "image"
        fichier: "assets/resultat.png"
        legende: "Résultat final"
        largeur_mm: 130
      - type: "encadre"
        style: "info"
        texte: "En cas de problème, consultez les journaux applicatifs."
