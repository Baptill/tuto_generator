<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <base href="{{ base_href }}" />
    <title>{{ article.titre }}</title>

    <!-- Charte injectée au build : @page, @font-face, variables, styles nommés -->
    <style>
      {{ charte_css | safe }}
    </style>

    <!-- Design-system du template : layout des blocs (jamais de couleur en dur,
     tout passe par les variables --couleur-* de la charte). -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", sans-serif;
        color: var(--couleur-texte);
        background: var(--couleur-fond);
      }

      h1.titre-1 {
        margin: 0 0 6mm;
      }
      p.corps {
        margin: 0 0 2.5mm;
      }

      /* En-tête du document : exactement 1 unité, la hauteur réservée par la
     pagination — `height` et non `min-height`, sinon un résumé long ou une
     liste de prérequis fournie repousserait la première section hors de son
     quota. Le contenu se répartit dans cette hauteur (space-evenly) et ce qui
     déborderait est rogné. Espacement en padding interne (inclus dans la
     hauteur via border-box) et non en margin externe. */
      .doc-header {
        height: var(--unit-height);
        overflow: hidden;
        padding-bottom: 4mm;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
      }
      .doc-header .logo {
        height: 12mm;
        margin-bottom: 3mm;
      }
      .doc-header .resume {
        color: var(--couleur-texte);
        margin: 0 0 3mm;
      }
      .prerequis ul {
        margin: 1mm 0 0;
        padding-left: 5mm;
      }

      .page {
        background: var(--couleur-fond);
      }
      @media print {
        .page {
          break-after: page;
        }
        .page:last-child {
          break-after: auto;
        }
      }

      /* Sections : la structure (hauteurs, grilles, images) est injectée par
         le moteur (app/layouts.py). Ici, le style propre au template. */
      .encadre-astuce {
        border-color: #a8d5ae;
        background: #eef8ef;
      }
      .encadre-astuce .encadre-icone span {
        background: #2e9d4f;
      }
      .encadre-attention {
        border-color: #efb4ab;
        background: #fdf0ee;
      }
      .encadre-attention .encadre-icone span {
        background: #d64535;
      }
      .encadre-info {
        border-color: #a9c3ef;
        background: #edf3fd;
      }
      .encadre-info .encadre-icone span {
        background: #1565c0;
      }

      @media screen {
        html {
          background: #fff;
        }
        body {
          margin: 0;
        }
        .page {
          width: 210mm;
          min-height: 297mm;
          margin: 8mm auto;
          padding: var(--marge);
          box-shadow: 0 1px 12px rgba(0, 0, 0, 0.18);
        }
      }
    </style>
  </head>
  <body>
    {{ pages_html | safe }}

    <!-- Barre d'édition + palette de modules insérables : injectées par
       app/editeur.py (source unique pour tous les templates). Visibles à
       l'écran uniquement — retirées du HTML enregistré et absentes du PDF. -->
    {{ editeur_html | safe }}
  </body>
</html>
